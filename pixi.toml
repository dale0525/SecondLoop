[workspace]
authors = ["Logic Tan <logictan89@gmail.com>"]
channels = ["conda-forge"]
name = "SecondLoop"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[target.unix.activation.env]
PUB_CACHE = "$PIXI_PROJECT_ROOT/.tool/pub-cache"
FVM_HOME = "$PIXI_PROJECT_ROOT/.tool/fvm"
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/.tool/cache/rust-dev-target"
CARGOKIT_TARGET_TEMP_DIR = "$PIXI_PROJECT_ROOT/.tool/cache/cargokit-target-temp"
CARGOKIT_TOOL_TEMP_DIR = "$PIXI_PROJECT_ROOT/.tool/cache/cargokit-target-temp/tool"

[target.win.activation.env]
PUB_CACHE = "%PIXI_PROJECT_ROOT%/.tool/pub-cache"
FVM_HOME = "%PIXI_PROJECT_ROOT%/.tool/fvm"

[tasks]
# Bootstrap task (first clone / new machine / Flutter drift).
# Installs and pins the required Flutter SDK via FVM, then runs flutter pub get.
setup-flutter = "dart pub global activate --no-executables fvm 2.4.1 && dart pub global run fvm:main install 3.22.3 && dart pub global run fvm:main use 3.22.3 --force && bash scripts/flutter_pub_get_with_retry.sh"

# Generic command entry points (keeps task count low).
# Common usage:
# - Flutter analyze/tests: pixi run flutter analyze / pixi run flutter test
# - Dart formatting: pixi run dart format "--output=none lib test ..."
# - Cargo checks/tests: pixi run cargo test / pixi run cargo clippy "--all-targets --all-features -- -D warnings"
flutter = { cmd = "dart pub global run fvm:main flutter {{ command }} {{ command_args }}", args = ["command", { arg = "command_args", default = "" }] }
dart = { cmd = "dart pub global run fvm:main dart {{ command }} {{ command_args }}", args = ["command", { arg = "command_args", default = "" }] }
cargo = { cmd = "cargo {{ command }} --manifest-path rust/Cargo.toml {{ command_args }}", args = ["command", { arg = "command_args", default = "" }] }

# Local developer helpers.
# - init-env: creates .env.local (idempotent, no-op when file exists)
# - install-git-hooks: installs local fast pre-commit and full pre-push hooks
# - bootstrap-shared-worktree-env: link .tool/.pixi/envs to git-common-dir shared storage and link .fvm/flutter_sdk + .env.local + Android signing files from primary worktree
init-env = "bash scripts/init_env.sh"
install-git-hooks = "bash scripts/install_git_hooks.sh"
bootstrap-shared-worktree-env = "bash scripts/bootstrap_shared_worktree_env.sh"

# Release helpers (maintainers).
# - release / release-app: auto-compute app tag with LLM and publish (triggers app release workflow)
# - release-runtime: publish desktop runtime tag (triggers desktop + mobile runtime workflow)
release = { cmd = "bash scripts/release_tag.sh", depends-on = ["bootstrap-shared-worktree-env"] }
release-app = { cmd = "bash scripts/release_tag.sh", depends-on = ["bootstrap-shared-worktree-env"] }
release-runtime = { cmd = "bash scripts/release_runtime_tag.sh", depends-on = ["bootstrap-shared-worktree-env"] }
release-preflight = { cmd = "bash scripts/release_preflight.sh", depends-on = ["bootstrap-shared-worktree-env"] }

# Cache cleanup (use when disk usage grows during long dev cycles).
clean-unused-cache = "bash scripts/clean_unused_cache.sh"
reset-local-dev-data = "python scripts/reset_local_dev_data.py"

# Quality gates (before sharing or opening a PR).
# - fmt: auto-fix formatting
# - fmt-check: check-only formatting (CI-aligned)
# - ci: full local verification (same scope as pre-push / GitHub Actions, runs Flutter/Rust in parallel locally)
fmt = "dart pub global run fvm:main dart format lib test rust_builder integration_test test_driver && cargo fmt --manifest-path rust/Cargo.toml --all"
fmt-check = "dart pub global run fvm:main dart format --output=none lib test rust_builder integration_test test_driver --set-exit-if-changed && cargo fmt --manifest-path rust/Cargo.toml --all -- --check"
verify-changed = "bash scripts/verify_changed.sh"
tooling-test = "bash scripts/run_python_tooling_checks.sh"
rust-nextest = "bash scripts/run_rust_ci_nextest.sh"
rust-builder-test = "bash scripts/run_rust_builder_package_tests.sh"
ci = "bash scripts/run_full_ci_parallel.sh"
cloud-runtime-automation-test = "dart pub global run fvm:main flutter test test/runtime_test_client_test.dart test/core/cloud/runtime_test_models_test.dart test/core/cloud/runtime_test_assertions_test.dart test/core/cloud/runtime_test_contract_compatibility_test.dart test/runtime_secretary_app_service_test.dart test/cloud_runtime_mode_page_test.dart test/features/settings/runtime_mode_page_test_ids_test.dart test/features/chat/chat_runtime_test_ids_test.dart"
cloud-runtime-scenarios-test = "dart pub global run fvm:main flutter test test/scenarios"
cloud-runtime-automation-smoke = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && bash scripts/flutter_with_defines.sh test -d macos integration_test/cloud_runtime_automation_smoke_test.dart"
cloud-runtime-integration-scenarios-test = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && bash scripts/run_cloud_runtime_integration_scenarios.sh"
cloud-runtime-live-managed-pro-chat-acceptance = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && bash scripts/flutter_with_defines.sh test -d macos integration_test/live_managed_pro_chat_acceptance_test.dart"
managed-pro-acceptance = "python scripts/managed_pro_acceptance.py --include-staging-reset"
managed-pro-acceptance-dry-run = "python scripts/managed_pro_acceptance.py --dry-run --include-staging-reset"

# Run/build workflows (auto-include setup-flutter + init-env).
# Typical usage:
# - Android local run: run-android / run-android-cn
# - Android release apk: build-android-apk / build-android-apk-cn
run-android = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && bash scripts/run_with_android_env.sh bash scripts/setup_android_sdk.sh && bash scripts/run_with_android_env.sh bash scripts/setup_rustup.sh && bash scripts/run_with_android_env.sh bash scripts/stop_gradle_daemons.sh && bash scripts/run_with_android_env.sh bash scripts/run_android_with_auto_emulator.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env"] }
build-android-apk = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && bash scripts/run_with_android_env.sh bash scripts/setup_android_sdk.sh && bash scripts/run_with_android_env.sh bash scripts/setup_rustup.sh && bash scripts/run_with_android_env.sh bash scripts/stop_gradle_daemons.sh && bash scripts/run_with_android_env.sh bash scripts/build_android_release_apk.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env"] }
run-android-cn = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/setup_android_sdk.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/setup_rustup.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/stop_gradle_daemons.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/run_android_with_auto_emulator.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env"] }
build-android-apk-cn = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/setup_android_sdk.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/setup_rustup.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/stop_gradle_daemons.sh && env SECONDLOOP_USE_CN_MIRRORS=1 FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn PUB_HOSTED_URL=https://pub.flutter-io.cn RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup bash scripts/run_with_android_env.sh bash scripts/build_android_release_apk.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env"] }

# Code/resource generation helpers.
# - frb-generate: regenerate Rust <-> Flutter bridge code
# - frb-build-web: build Rust wasm package into rust/web/pkg for Flutter web
# - frb-build-web-preview: build Rust wasm package without shared-memory atomics for local preview flows
# - sync-web-rust-pkg: mirror rust/web/pkg into build/web/pkg after flutter build
# - prepare-desktop-runtime-payload: materialize OCR models for runtime release packaging
# - prepare-desktop-runtime: fetch + install desktop OCR runtime assets from release
# - sync-desktop-runtime-to-appdir: mirror prepared desktop runtime into app support dir and stamp standard manifest
# - i18n-sync: translate and refresh strings.g.dart
# - icons-update: regenerate app icons (including macOS round-corner pre-processing)
frb-generate = "env RUST_LOG=info PATH=\"$PWD/.fvm/flutter_sdk/bin:$HOME/.cargo/bin:$PATH\" flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml"
frb-build-web = "bash scripts/setup_web_rust_toolchain.sh && env RUST_LOG=info CC_wasm32_unknown_unknown=\"$PWD/.tool/bin/clang\" AR_wasm32_unknown_unknown=\"$PWD/.tool/bin/llvm-ar\" RANLIB_wasm32_unknown_unknown=\"$PWD/.tool/bin/llvm-ranlib\" CARGO_HOME=\"$PWD/.tool/cargo-home\" RUSTUP_HOME=\"$PWD/.tool/rustup-home\" PATH=\"$PWD/.tool/bin:$PWD/.tool/cargo-home/bin:$HOME/.cargo/bin:$PWD/.fvm/flutter_sdk/bin:$PATH\" flutter pub run flutter_rust_bridge build-web --dart-root . -c rust -o web --release --wasm-pack-rustflags \"-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--shared-memory -C link-arg=--import-memory -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base -C link-arg=--max-memory=1073741824\""
frb-build-web-preview = "bash scripts/setup_web_rust_toolchain.sh && env RUST_LOG=info CC_wasm32_unknown_unknown=\"$PWD/.tool/bin/clang\" AR_wasm32_unknown_unknown=\"$PWD/.tool/bin/llvm-ar\" RANLIB_wasm32_unknown_unknown=\"$PWD/.tool/bin/llvm-ranlib\" CARGO_HOME=\"$PWD/.tool/cargo-home\" RUSTUP_HOME=\"$PWD/.tool/rustup-home\" PATH=\"$PWD/.tool/bin:$PWD/.tool/cargo-home/bin:$HOME/.cargo/bin:$PWD/.fvm/flutter_sdk/bin:$PATH\" flutter pub run flutter_rust_bridge build-web --dart-root . -c rust -o web --release --wasm-pack-rustflags \"-Aunstable-features -C target-feature=+bulk-memory,+mutable-globals\""
sync-web-rust-pkg = "dart pub global run fvm:main dart run tools/sync_web_build_rust_pkg.dart"
preview-local-web-app = { cmd = "bash scripts/preview_local_web_app.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "frb-build-web"] }
prepare-desktop-runtime-payload = "bash scripts/prepare_desktop_runtime_payload.sh --output-dir assets/ocr/desktop_runtime"
prepare-desktop-runtime = "dart pub global run fvm:main dart run tools/prepare_desktop_runtime.dart"
sync-desktop-runtime-to-appdir = "dart pub global run fvm:main dart run tools/sync_desktop_runtime_to_appdir.dart"
i18n-normalize = "dart pub global run fvm:main flutter pub run slang normalize"
i18n-gen = "dart pub global run fvm:main flutter pub run slang && dart pub global run fvm:main dart format lib/i18n/strings.g.dart"
i18n-analyze = "bash scripts/run_i18n_analyze.sh"
i18n-refresh = "bash scripts/run_i18n_refresh.sh"
i18n-translate = { cmd = "python tools/i18n_translate.py {{ command_args }}", args = [{ arg = "command_args", default = "" }] }
i18n-sync = { depends-on = ["i18n-translate", "i18n-refresh"] }
icons-macos-round = "python tools/round_icon.py --in assets/icon/app_icon.png --out assets/icon/app_icon_macos.png"
icons-macos-check = "python tools/check_icon_corners.py --path assets/icon/app_icon_macos.png"
icons-update = { cmd = "dart pub global run fvm:main dart run icons_launcher:create", depends-on = ["icons-macos-round", "icons-macos-check"] }
prepare-ffmpeg = "dart pub global run fvm:main dart run tools/prepare_bundled_ffmpeg.dart"

[dependencies]
rust = "1.85.*"
python = "3.11.*"
pillow = ">=10,<12"
cmake = ">=4.2.1,<5"
ninja = ">=1.13.2,<2"
dart-sdk = "2.18.2.*"
openjdk = "17.*"
cargo-nextest = "0.9.*"

[target.osx-arm64.dependencies]
ruby = ">=3.4.8,<4"
clang_osx-arm64 = ">=21.1.8,<22"
clangxx_osx-arm64 = ">=21.1.8,<22"

[target.osx-arm64.tasks]
prepare-ffmpeg-macos = "bash scripts/setup_ffmpeg_macos.sh && dart pub global run fvm:main dart run tools/prepare_bundled_ffmpeg.dart --platform=macos"
run-macos = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && gem list -i cocoapods -v 1.16.2 || gem install cocoapods -v 1.16.2 && dart pub global run fvm:main dart run tools/prepare_desktop_runtime.dart --platform=macos && dart pub global run fvm:main dart run tools/sync_desktop_runtime_to_appdir.dart --platform=macos && env -u AR -u CC -u CFLAGS -u CPPFLAGS -u CXX -u CXXFLAGS -u LD -u LDFLAGS -u NM -u RANLIB -u SDKROOT -u STRIP LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 bash scripts/flutter_with_defines.sh run -d macos", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "prepare-ffmpeg-macos"] }
managed-pro-agent-ui-acceptance = { cmd = "bash scripts/run_managed_pro_agent_ui_acceptance.sh", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env"] }

[target.linux-64.dependencies]
poppler = "*"
tesseract = "*"
[target.linux-64.tasks]
prepare-ffmpeg-linux = "dart pub global run fvm:main dart run tools/prepare_bundled_ffmpeg.dart --platform=linux"
run-linux = { cmd = "export SECONDLOOP_APP_ID=com.secondloop.secondloopdev SECONDLOOP_APP_NAME='SecondLoop Dev' && dart pub global run fvm:main dart run tools/prepare_desktop_runtime.dart --platform=linux --arch=x64 && dart pub global run fvm:main dart run tools/sync_desktop_runtime_to_appdir.dart --platform=linux && bash scripts/flutter_with_defines.sh run -d linux", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "prepare-ffmpeg-linux"] }

[target.win-64.dependencies]
libclang = ">=21.1.8,<22"
dotnet-sdk = "8.0.*"
dotnet-aspnetcore = "8.0.*"

[target.win-64.tasks]
# Windows-specific overrides.
# - bootstrap-shared-worktree-env uses PowerShell (no bash dependency)
# - init-env uses PowerShell (no bash dependency)
# - setup-flutter enables git long-path support before FVM clone/checkouts
# - ci routes local parallel full verification through PowerShell launcher
# - run-windows defaults to flutter hot-reload/debugger flow
# - msi-dev packages + installs isolated local dev MSI
# - uninstall-dev-msi removes isolated local dev MSI
verify-changed = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/verify_changed.sh"
tooling-test = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/run_python_tooling_checks.sh"
rust-nextest = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/run_rust_ci_nextest.sh"
rust-builder-test = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/run_rust_builder_package_tests.sh"
ci = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/run_full_ci_parallel.sh"
install-git-hooks = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_bash.ps1 scripts/install_git_hooks.sh"
frb-generate = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/frb_generate.ps1"
bootstrap-shared-worktree-env = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap_shared_worktree_env.ps1"
init-env = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/init_env.ps1"
setup-flutter = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_flutter_windows.ps1"
flutter = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_fvm_tool.ps1 -Tool flutter -Command {{ command }} {{ command_args }}", args = ["command", { arg = "command_args", default = "" }] }
dart = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_fvm_tool.ps1 -Tool dart -Command {{ command }} {{ command_args }}", args = ["command", { arg = "command_args", default = "" }] }
prepare-ffmpeg-windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare_ffmpeg_windows.ps1"
run-windows = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_windows.ps1 -UseFlutterRun", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "prepare-ffmpeg-windows"] }
msi-dev = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_windows.ps1", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "prepare-ffmpeg-windows"] }
uninstall-dev-msi = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/uninstall_windows_msi.ps1 -ProductName 'SecondLoop Dev' -InstallDirName 'SecondLoop Dev' -Quiet" }
package-windows-velopack = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows_velopack.ps1", depends-on = ["bootstrap-shared-worktree-env", "setup-flutter", "init-env", "prepare-ffmpeg-windows"] }
