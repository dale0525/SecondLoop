name: Web Build

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - ".fvm/fvm_config.json"
      - ".githooks/**"
      - ".github/workflows/web-build.yml"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "test_driver/**"
      - "rust_builder/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".fvm/fvm_config.json"
      - ".githooks/**"
      - ".github/workflows/web-build.yml"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "test_driver/**"
      - "rust_builder/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - name: Setup Flutter
        run: pixi run setup-flutter
      - name: "Guard: no python runtime process usage"
        run: bash scripts/check_no_python_runtime.sh
      - name: Generate i18n
        run: pixi run i18n-gen
      - name: Build Flutter Web
        run: pixi run flutter build "web --base-href /app/"
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: secondloop-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch site deploy after release
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        env:
          GH_TOKEN: ${{ secrets.SECONDLOOP_SERVER_DISPATCH_TOKEN }}
          SITE_REPO: ${{ vars.SECONDLOOP_SERVER_REPO || format('{0}/SecondLoopServer', github.repository_owner) }}
          SECONDLOOP_REPO: ${{ github.repository }}
          SECONDLOOP_WEB_RUN_ID: ${{ github.run_id }}
          SECONDLOOP_WEB_HEAD_SHA: ${{ github.sha }}
          SECONDLOOP_WEB_REF: ${{ github.event.release.target_commitish || github.ref_name }}
          SECONDLOOP_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "SECONDLOOP_SERVER_DISPATCH_TOKEN is not configured; skipping site deploy dispatch."
            exit 0
          fi
          gh api "repos/$SITE_REPO/dispatches" \
            --method POST \
            -f event_type='secondloop_web_release_published' \
            -F client_payload[secondloop_repo]="$SECONDLOOP_REPO" \
            -F client_payload[secondloop_web_run_id]="$SECONDLOOP_WEB_RUN_ID" \
            -F client_payload[secondloop_web_head_sha]="$SECONDLOOP_WEB_HEAD_SHA" \
            -F client_payload[secondloop_web_ref]="$SECONDLOOP_WEB_REF" \
            -F client_payload[release_tag]="$SECONDLOOP_RELEASE_TAG"
