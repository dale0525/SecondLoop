name: Web Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".fvm/fvm_config.json"
      - ".githooks/**"
      - ".github/workflows/web-build.yml"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "test_driver/**"
      - "rust_builder/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".fvm/fvm_config.json"
      - ".githooks/**"
      - ".github/workflows/web-build.yml"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "test_driver/**"
      - "rust_builder/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - name: Setup Flutter
        run: pixi run setup-flutter
      - name: Guard: no python runtime process usage
        run: bash scripts/check_no_python_runtime.sh
      - name: Generate i18n
        run: pixi run i18n-gen
      - name: Build Flutter Web
        run: pixi run flutter build "web --base-href /app/"
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: secondloop-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7
