name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      runtime_tag: ${{ steps.runtime_preflight.outputs.runtime_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate app release tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app release tag: ${GITHUB_REF_NAME}. Expected vX.Y.Z"
            exit 1
          fi
      - name: Release preflight
        id: runtime_preflight
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash scripts/release_preflight.sh --repo "${GITHUB_REPOSITORY}" | tee "${log_file}"
          runtime_tag="$(sed -n 's/^release-preflight: resolved_runtime_tag=//p' "${log_file}" | tail -n1)"
          if [[ -z "${runtime_tag}" ]]; then
            echo "Failed to resolve runtime tag from release preflight output"
            exit 1
          fi
          echo "runtime_tag=${runtime_tag}" >> "${GITHUB_OUTPUT}"

  android:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SECONDLOOP_FIREBASE_WEB_API_KEY: ${{ secrets.SECONDLOOP_FIREBASE_WEB_API_KEY }}
      SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD: ${{ secrets.SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD }}
      SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD: ${{ secrets.SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set"
            exit 1
          fi

          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${sdkmanager}" || ! -x "${sdkmanager}" ]]; then
            echo "sdkmanager not found (checked ${sdk_root}/cmdline-tools/latest/bin/sdkmanager and PATH)"
            exit 1
          fi

          flutter_gradle="${FLUTTER_ROOT}/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [[ ! -f "${flutter_gradle}" ]]; then
            echo "Unable to locate Flutter gradle config at ${flutter_gradle}"
            exit 1
          fi

          flutter_ndk_version="$(sed -nE "s/^.*ndkVersion[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" "${flutter_gradle}" | head -n1)"
          if [[ -z "${flutter_ndk_version}" ]]; then
            echo "Failed to parse ndkVersion from ${flutter_gradle}"
            exit 1
          fi
          ndk_package="ndk;${flutter_ndk_version}"

          set +o pipefail
          yes | "${sdkmanager}" --sdk_root="${sdk_root}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager}" --sdk_root="${sdk_root}" --install "${ndk_package}"

          ndk_root="${sdk_root}/ndk/${flutter_ndk_version}"
          if [[ ! -d "${ndk_root}" ]]; then
            echo "Installed NDK root not found: ${ndk_root}"
            exit 1
          fi
          echo "SECONDLOOP_ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"
      - name: Validate prod config
        shell: bash
        run: |
          : "${SECONDLOOP_FIREBASE_WEB_API_KEY:?Missing secret SECONDLOOP_FIREBASE_WEB_API_KEY}"
          : "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD:?Missing secret SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
          : "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD:?Missing secret SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod gateway URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging gateway URL."
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod managed vault URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging managed vault URL."
            exit 1
          fi
      - name: Validate Android signing (tag releases)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing secret ANDROID_KEY_PASSWORD}"
      - name: Setup Android signing (tag releases)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p android/app
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties
      - run: flutter pub get
      - name: Refresh i18n generated files
        shell: bash
        run: bash scripts/run_i18n_refresh.sh
      - name: Setup Rustup for Android build
        shell: bash
        run: bash scripts/setup_rustup.sh
      - name: Build (prod)
        shell: bash
        run: |
          build_number="${GITHUB_RUN_NUMBER}"
          build_name=''
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "${candidate}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            fi
          fi

          build_args=("--build-number=${build_number}")
          if [[ -n "${build_name}" ]]; then
            build_args+=("--build-name=${build_name}")
          fi

          defines=(
            "--dart-define=SECONDLOOP_FIREBASE_WEB_API_KEY=${SECONDLOOP_FIREBASE_WEB_API_KEY}"
            "--dart-define=SECONDLOOP_CLOUD_GATEWAY_BASE_URL=${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_MANAGED_VAULT_BASE_URL=${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_RELEASE_REPO=${GITHUB_REPOSITORY}"
            "--dart-define=SECONDLOOP_RELEASE_API_ORIGIN="
            "--dart-define=SECONDLOOP_UPDATE_PUBLIC_KEY=${SECONDLOOP_UPDATE_PUBLIC_KEY}"
          )

          : "${SECONDLOOP_ANDROID_NDK_ROOT:?Missing Android NDK root from install step}"
          ndk_sysroot="${SECONDLOOP_ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [[ ! -d "${ndk_sysroot}" ]]; then
            echo "Android NDK sysroot not found: ${ndk_sysroot}"
            exit 1
          fi

          export ANDROID_NDK_ROOT="${SECONDLOOP_ANDROID_NDK_ROOT}"
          export ANDROID_NDK_HOME="${SECONDLOOP_ANDROID_NDK_ROOT}"
          export ANDROID_NDK="${SECONDLOOP_ANDROID_NDK_ROOT}"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${ndk_sysroot}"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=${ndk_sysroot} --target=armv7a-linux-androideabi23"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=${ndk_sysroot} --target=aarch64-linux-android23"

          bash scripts/build_android_release_apk.sh "${build_args[@]}" "${defines[@]}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          safe_ref_name="$(printf "%s" "${GITHUB_REF_NAME}" | sed -E "s/[^[:alnum:]._-]+/-/g; s/^-+//; s/-+$//")"
          if [[ -z "${safe_ref_name}" ]]; then
            safe_ref_name="run-${GITHUB_RUN_ID}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/SecondLoop-android-${safe_ref_name}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  windows:
    needs: preflight
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SECONDLOOP_FIREBASE_WEB_API_KEY: ${{ secrets.SECONDLOOP_FIREBASE_WEB_API_KEY }}
      SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD: ${{ secrets.SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD }}
      SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD: ${{ secrets.SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD }}
      SECONDLOOP_DESKTOP_RUNTIME_TAG: ${{ needs.preflight.outputs.runtime_tag }}
      SECONDLOOP_UPDATE_PUBLIC_KEY: ${{ secrets.SECONDLOOP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Validate prod config
        shell: pwsh
        run: |
          if (-not $Env:SECONDLOOP_FIREBASE_WEB_API_KEY) { throw "Missing secret SECONDLOOP_FIREBASE_WEB_API_KEY" }
          if (-not $Env:SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD) { throw "Missing secret SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD" }
          if (-not $Env:SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD) { throw "Missing secret SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD" }
          if (-not $Env:SECONDLOOP_DESKTOP_RUNTIME_TAG) { throw "Missing runtime tag resolved by preflight" }
          if ($Env:SECONDLOOP_DESKTOP_RUNTIME_TAG -notmatch '^desktop-runtime-v\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid SECONDLOOP_DESKTOP_RUNTIME_TAG: $Env:SECONDLOOP_DESKTOP_RUNTIME_TAG" }
          if (-not $Env:SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD.StartsWith("https://")) { throw "Prod gateway URL must start with https://" }
          if ($Env:SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD -match "staging" -or $Env:SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD -match "stage") { throw "Refusing to build prod release with a staging gateway URL." }
          if (-not $Env:SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD.StartsWith("https://")) { throw "Prod managed vault URL must start with https://" }
          if ($Env:SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD -match "staging" -or $Env:SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD -match "stage") { throw "Refusing to build prod release with a staging managed vault URL." }
      - shell: pwsh
        run: flutter pub get
      - name: Refresh i18n generated files
        shell: pwsh
        run: bash scripts/run_i18n_refresh.sh
      - name: Prepare desktop runtime assets
        shell: pwsh
        run: |
          $runtimeArch = if ($Env:PROCESSOR_ARCHITECTURE -match 'ARM64') { 'arm64' } else { 'x64' }
          dart run tools/prepare_desktop_runtime.dart `
            --platform=windows `
            --arch=$runtimeArch `
            --runtime-tag=$Env:SECONDLOOP_DESKTOP_RUNTIME_TAG `
            --require-runtime-tag `
            --repo=$Env:GITHUB_REPOSITORY
      - name: Setup FFmpeg
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_ffmpeg_windows.ps1
      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: dart run tools/prepare_bundled_ffmpeg.dart --platform=windows
      - name: Prune non-target FFmpeg assets (windows)
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $Env:GITHUB_WORKSPACE 'assets/bin/ffmpeg'
          $targetFfmpeg = Join-Path $ffmpegRoot 'windows/ffmpeg.zip'
          if (-not (Test-Path -LiteralPath $targetFfmpeg)) {
            throw "Expected bundled windows ffmpeg not found: $targetFfmpeg"
          }

          $removeDirs = @('macos', 'linux')
          foreach ($name in $removeDirs) {
            $dir = Join-Path $ffmpegRoot $name
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force
            }
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            New-Item -ItemType File -Path (Join-Path $dir '.gitkeep') -Force | Out-Null
            Write-Host "Pruned non-target ffmpeg directory: $dir"
          }
      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
      - name: Build (prod)
        shell: pwsh
        run: |
          cmd /c subst W: /d > $null 2>&1
          $workspaceParent = Split-Path -Parent $Env:GITHUB_WORKSPACE
          $workspaceLeaf = Split-Path -Leaf $Env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($workspaceParent) -or [string]::IsNullOrWhiteSpace($workspaceLeaf)) {
            throw "Unable to resolve workspace path segments from $Env:GITHUB_WORKSPACE"
          }
          cmd /c subst W: $workspaceParent
          $shortWorkspacePath = "W:\$workspaceLeaf"

          $enteredWorkspace = $false
          try {
            if (-not (Test-Path -LiteralPath $shortWorkspacePath)) {
              throw "Short workspace path not found: $shortWorkspacePath"
            }
            Push-Location $shortWorkspacePath
            $enteredWorkspace = $true

            $Env:CARGOKIT_TARGET_TEMP_DIR = 'W:\ck'
            $Env:CARGOKIT_TOOL_TEMP_DIR = 'W:\ck\tool'
            New-Item -ItemType Directory -Path $Env:CARGOKIT_TARGET_TEMP_DIR -Force | Out-Null
            New-Item -ItemType Directory -Path $Env:CARGOKIT_TOOL_TEMP_DIR -Force | Out-Null

            $buildArgs = @("--build-number=$Env:GITHUB_RUN_NUMBER")
            if ($Env:GITHUB_REF -like "refs/tags/v*") {
              $candidate = $Env:GITHUB_REF_NAME.Substring(1)
              if ($candidate -match '^(\d+)\.(\d+)\.(\d+)$') {
                $buildArgs += "--build-name=$($Matches[1]).$($Matches[2]).$($Matches[3])"
              }
            }
            $defines = @(
              "--dart-define=SECONDLOOP_FIREBASE_WEB_API_KEY=$Env:SECONDLOOP_FIREBASE_WEB_API_KEY",
              "--dart-define=SECONDLOOP_CLOUD_GATEWAY_BASE_URL=$Env:SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD",
              "--dart-define=SECONDLOOP_MANAGED_VAULT_BASE_URL=$Env:SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD",
              "--dart-define=SECONDLOOP_RELEASE_REPO=$Env:GITHUB_REPOSITORY",
              "--dart-define=SECONDLOOP_RELEASE_API_ORIGIN=",
              "--dart-define=SECONDLOOP_UPDATE_PUBLIC_KEY=$Env:SECONDLOOP_UPDATE_PUBLIC_KEY"
            )
            $Env:CMAKE_GENERATOR = "Ninja"
            flutter build windows --release -v @buildArgs @defines
            if ($LASTEXITCODE -ne 0) {
              throw "flutter build windows failed with exit code $LASTEXITCODE"
            }
          } finally {
            if ($enteredWorkspace) {
              Pop-Location
            }
            cmd /c subst W: /d > $null 2>&1
          }
      - name: Package MSI
        shell: pwsh
        run: |
          $msiVersion = $null
          if ($Env:GITHUB_REF -like "refs/tags/v*") {
            $candidate = $Env:GITHUB_REF_NAME.Substring(1)
            if ($candidate -match '^\d+\.\d+\.\d+$') {
              $msiVersion = $candidate
            } else {
              throw "Invalid release tag version: $Env:GITHUB_REF_NAME"
            }
          }

          $releaseDir = Join-Path (Resolve-Path '.') 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release output not found: $releaseDir"
          }

          $msiArgs = @{
            SourceDir = $releaseDir
            OutputPath = 'dist'
            OutputName = 'SecondLoop-win'
            PassThru = $true
          }
          if ($msiVersion) {
            $msiArgs.Version = $msiVersion
          }

          $msiPathOutput = & scripts/create_windows_msi.ps1 @msiArgs
          if ($LASTEXITCODE -ne 0) {
            throw "MSI packaging failed with exit code $LASTEXITCODE"
          }

          $msiPath = $msiPathOutput | Select-Object -Last 1
          if (-not $msiPath -or -not (Test-Path $msiPath)) {
            throw "MSI package not found in dist"
          }

          $msiLeafName = [System.IO.Path]::GetFileName($msiPath)
          if ($msiLeafName -ne 'SecondLoop-win.msi') {
            throw "Unexpected MSI asset name: $msiLeafName"
          }

          $msiShaPath = Join-Path (Split-Path -Parent $msiPath) ($msiLeafName + '.sha256')
          $msiHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msiPath).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($msiShaPath, "$msiHash  $msiLeafName`n", [System.Text.UTF8Encoding]::new($false))

          $msiMetadataPath = Join-Path (Split-Path -Parent $msiPath) 'SecondLoop-win.metadata.json'
          $msiMetadataOutput = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/export_windows_msi_metadata.ps1 -MsiPath $msiPath -OutputPath $msiMetadataPath
          if ($LASTEXITCODE -ne 0) {
            throw "MSI metadata export failed with exit code $LASTEXITCODE"
          }

          $resolvedMetadataPath = $msiMetadataOutput | Select-Object -Last 1
          if (-not $resolvedMetadataPath -or -not (Test-Path $resolvedMetadataPath)) {
            throw "MSI metadata file not found in dist"
          }

          Write-Host "MSI package ready: $msiPath"
          Write-Host "MSI checksum ready: $msiShaPath"
          Write-Host "MSI metadata ready: $resolvedMetadataPath"
      - name: Package Velopack
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows_velopack.ps1 -SkipBuild -OutputPath dist -Channel win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/SecondLoop-win.msi
            dist/SecondLoop-win.msi.sha256
            dist/SecondLoop-win.metadata.json
            dist/*Setup*.exe
            dist/*.nupkg
            dist/releases.*.json
            dist/assets.*.json

  macos:
    needs: preflight
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SECONDLOOP_FIREBASE_WEB_API_KEY: ${{ secrets.SECONDLOOP_FIREBASE_WEB_API_KEY }}
      SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD: ${{ secrets.SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD }}
      SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD: ${{ secrets.SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD }}
      SECONDLOOP_DESKTOP_RUNTIME_TAG: ${{ needs.preflight.outputs.runtime_tag }}
      SECONDLOOP_UPDATE_PUBLIC_KEY: ${{ secrets.SECONDLOOP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - name: Install CocoaPods
        shell: bash
        run: |
          if ! gem list -i cocoapods -v 1.16.2 >/dev/null 2>&1; then
            sudo gem install cocoapods -v 1.16.2
          fi
      - name: Validate prod config
        shell: bash
        run: |
          : "${SECONDLOOP_FIREBASE_WEB_API_KEY:?Missing secret SECONDLOOP_FIREBASE_WEB_API_KEY}"
          : "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD:?Missing secret SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
          : "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD:?Missing secret SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
          : "${SECONDLOOP_DESKTOP_RUNTIME_TAG:?Missing runtime tag resolved by preflight}"
          if [[ ! "${SECONDLOOP_DESKTOP_RUNTIME_TAG}" =~ ^desktop-runtime-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid SECONDLOOP_DESKTOP_RUNTIME_TAG: ${SECONDLOOP_DESKTOP_RUNTIME_TAG}"
            exit 1
          fi
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod gateway URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging gateway URL."
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod managed vault URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging managed vault URL."
            exit 1
          fi
      - run: flutter pub get
      - name: Refresh i18n generated files
        shell: bash
        run: bash scripts/run_i18n_refresh.sh
      - name: Prepare desktop runtime assets
        shell: bash
        run: |
          set -euo pipefail
          runtime_arch='x64'
          host_arch="$(uname -m)"
          case "${host_arch}" in
            arm64|aarch64) runtime_arch='arm64' ;;
            x86_64|amd64) runtime_arch='x64' ;;
          esac
          dart run tools/prepare_desktop_runtime.dart \
            --platform=macos \
            --arch="${runtime_arch}" \
            --runtime-tag="${SECONDLOOP_DESKTOP_RUNTIME_TAG}" \
            --require-runtime-tag \
            --repo="${GITHUB_REPOSITORY}"
      - name: Install FFmpeg
        shell: bash
        run: brew install ffmpeg
      - name: Prepare bundled FFmpeg
        shell: bash
        run: dart run tools/prepare_bundled_ffmpeg.dart --platform=macos
      - name: Prune non-target FFmpeg assets (macos)
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/bin/ffmpeg/macos/ffmpeg
          rm -rf assets/bin/ffmpeg/windows assets/bin/ffmpeg/linux
          mkdir -p assets/bin/ffmpeg/windows assets/bin/ffmpeg/linux
          touch assets/bin/ffmpeg/windows/.gitkeep assets/bin/ffmpeg/linux/.gitkeep
      - name: Build (prod)
        shell: bash
        run: |
          build_number="${GITHUB_RUN_NUMBER}"
          build_name=''
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "${candidate}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            fi
          fi

          build_args=("--build-number=${build_number}")
          if [[ -n "${build_name}" ]]; then
            build_args+=("--build-name=${build_name}")
          fi

          defines=(
            "--dart-define=SECONDLOOP_FIREBASE_WEB_API_KEY=${SECONDLOOP_FIREBASE_WEB_API_KEY}"
            "--dart-define=SECONDLOOP_CLOUD_GATEWAY_BASE_URL=${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_MANAGED_VAULT_BASE_URL=${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_RELEASE_REPO=${GITHUB_REPOSITORY}"
            "--dart-define=SECONDLOOP_RELEASE_API_ORIGIN="
            "--dart-define=SECONDLOOP_UPDATE_PUBLIC_KEY=${SECONDLOOP_UPDATE_PUBLIC_KEY}"
          )
          # whisper-rs currently enables i8mm code paths under certain Apple/Clang combinations
          # that are not always safe on hosted runners. Undefine the macro so ggml falls back.
          export CFLAGS="${CFLAGS-} -U__ARM_FEATURE_MATMUL_INT8"
          export CXXFLAGS="${CXXFLAGS-} -U__ARM_FEATURE_MATMUL_INT8"

          # flutter build macos defaults to code signing and fails on CI without Apple certs.
          # Use config-only to generate build settings (build name/number + dart-defines),
          # then build with xcodebuild while explicitly disabling code signing.
          flutter build macos --release --config-only "${build_args[@]}" "${defines[@]}"
          (cd macos && pod install)
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -configuration Release \
            -scheme Runner \
            -derivedDataPath "$PWD/build/macos" \
            -destination platform=macOS \
            OBJROOT="$PWD/build/macos/Build/Intermediates.noindex" \
            SYMROOT="$PWD/build/macos/Build/Products" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # NOTE: .app is a directory; `ls` without `-d` would list its contents (e.g. "Contents").
          app="$(ls -1d build/macos/Build/Products/Release/*.app | head -n 1)"
          safe_ref_name="$(printf "%s" "${GITHUB_REF_NAME}" | sed -E "s/[^[:alnum:]._-]+/-/g; s/^-+//; s/-+$//")"
          if [[ -z "${safe_ref_name}" ]]; then
            safe_ref_name="run-${GITHUB_RUN_ID}"
          fi
          dmg_path="dist/SecondLoop-macos-${safe_ref_name}.dmg"
          bash scripts/package_macos_dmg.sh \
            --app "${app}" \
            --output "${dmg_path}" \
            --volume-name "SecondLoop"
          app_archive_path="dist/SecondLoop-macos-${safe_ref_name}.app.tar.gz"
          tar -C "$(dirname "${app}")" -czf "${app_archive_path}" "$(basename "${app}")"
          dmg_name="$(basename "${dmg_path}")"
          app_archive_name="$(basename "${app_archive_path}")"
          (
            cd dist
            shasum -a 256 "${dmg_name}" > "${dmg_name}.sha256"
            shasum -a 256 "${app_archive_name}" > "${app_archive_name}.sha256"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sha256

  linux:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SECONDLOOP_FIREBASE_WEB_API_KEY: ${{ secrets.SECONDLOOP_FIREBASE_WEB_API_KEY }}
      SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD: ${{ secrets.SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD }}
      SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD: ${{ secrets.SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD }}
      SECONDLOOP_DESKTOP_RUNTIME_TAG: ${{ needs.preflight.outputs.runtime_tag }}
      SECONDLOOP_UPDATE_PUBLIC_KEY: ${{ secrets.SECONDLOOP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          indicator_pkg='libayatana-appindicator3-dev'
          if ! apt-cache show "${indicator_pkg}" >/dev/null 2>&1; then
            indicator_pkg='libappindicator3-dev'
          fi
          sudo apt-get install -y \
            clang \
            cmake \
            ffmpeg \
            libgtk-3-dev \
            "${indicator_pkg}" \
            libkeybinder-3.0-dev \
            liblzma-dev \
            libsecret-1-dev \
            libvulkan-dev \
            ninja-build \
            pkg-config \
            libpoppler-glib-dev \
            tesseract-ocr
      - name: Validate prod config
        shell: bash
        run: |
          : "${SECONDLOOP_FIREBASE_WEB_API_KEY:?Missing secret SECONDLOOP_FIREBASE_WEB_API_KEY}"
          : "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD:?Missing secret SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
          : "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD:?Missing secret SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
          : "${SECONDLOOP_DESKTOP_RUNTIME_TAG:?Missing runtime tag resolved by preflight}"
          if [[ ! "${SECONDLOOP_DESKTOP_RUNTIME_TAG}" =~ ^desktop-runtime-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid SECONDLOOP_DESKTOP_RUNTIME_TAG: ${SECONDLOOP_DESKTOP_RUNTIME_TAG}"
            exit 1
          fi
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod gateway URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging gateway URL."
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" != https://* ]]; then
            echo "Prod managed vault URL must start with https://"
            exit 1
          fi
          if [[ "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"staging"* || "${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}" == *"stage"* ]]; then
            echo "Refusing to build prod release with a staging managed vault URL."
            exit 1
          fi
      - run: flutter pub get
      - name: Refresh i18n generated files
        shell: bash
        run: bash scripts/run_i18n_refresh.sh
      - name: Prepare desktop runtime assets
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/prepare_desktop_runtime.dart \
            --platform=linux \
            --arch=x64 \
            --runtime-tag="${SECONDLOOP_DESKTOP_RUNTIME_TAG}" \
            --require-runtime-tag \
            --repo="${GITHUB_REPOSITORY}"
      - name: Prepare bundled FFmpeg
        shell: bash
        run: dart run tools/prepare_bundled_ffmpeg.dart --platform=linux
      - name: Prune non-target FFmpeg assets (linux)
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/bin/ffmpeg/linux/ffmpeg
          rm -rf assets/bin/ffmpeg/windows assets/bin/ffmpeg/macos
          mkdir -p assets/bin/ffmpeg/windows assets/bin/ffmpeg/macos
          touch assets/bin/ffmpeg/windows/.gitkeep assets/bin/ffmpeg/macos/.gitkeep
      - name: Build (prod)
        shell: bash
        run: |
          build_number="${GITHUB_RUN_NUMBER}"
          build_name=''
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "${candidate}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            fi
          fi

          build_args=("--build-number=${build_number}")
          if [[ -n "${build_name}" ]]; then
            build_args+=("--build-name=${build_name}")
          fi

          defines=(
            "--dart-define=SECONDLOOP_FIREBASE_WEB_API_KEY=${SECONDLOOP_FIREBASE_WEB_API_KEY}"
            "--dart-define=SECONDLOOP_CLOUD_GATEWAY_BASE_URL=${SECONDLOOP_CLOUD_GATEWAY_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_MANAGED_VAULT_BASE_URL=${SECONDLOOP_MANAGED_VAULT_BASE_URL_PROD}"
            "--dart-define=SECONDLOOP_RELEASE_REPO=${GITHUB_REPOSITORY}"
            "--dart-define=SECONDLOOP_RELEASE_API_ORIGIN="
            "--dart-define=SECONDLOOP_UPDATE_PUBLIC_KEY=${SECONDLOOP_UPDATE_PUBLIC_KEY}"
          )
          flutter build linux --release "${build_args[@]}" "${defines[@]}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          safe_ref_name="$(printf "%s" "${GITHUB_REF_NAME}" | sed -E "s/[^[:alnum:]._-]+/-/g; s/^-+//; s/-+$//")"
          if [[ -z "${safe_ref_name}" ]]; then
            safe_ref_name="run-${GITHUB_RUN_ID}"
          fi
          tar -C build/linux/x64/release -czf "dist/SecondLoop-linux-x64-${safe_ref_name}.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [preflight, android, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_LLM_BASE_URL: ${{ secrets.RELEASE_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      RELEASE_LLM_ENDPOINT: ${{ secrets.RELEASE_LLM_ENDPOINT || vars.RELEASE_LLM_ENDPOINT || '' }}
      RELEASE_LLM_MODEL: ${{ secrets.RELEASE_LLM_MODEL }}
      RELEASE_LLM_AUTH_HEADER: ${{ secrets.RELEASE_LLM_AUTH_HEADER || vars.RELEASE_LLM_AUTH_HEADER || '' }}
      RELEASE_LLM_AUTH_SCHEME: ${{ secrets.RELEASE_LLM_AUTH_SCHEME || vars.RELEASE_LLM_AUTH_SCHEME || 'Bearer' }}
      RELEASE_NOTES_LOCALES: ${{ vars.RELEASE_NOTES_LOCALES || 'zh-CN,en-US' }}
      RELEASE_LLM_API_KEY: ${{ secrets.RELEASE_LLM_API_KEY }}
      SECONDLOOP_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.SECONDLOOP_UPDATE_SIGNING_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - run: dart pub get
      - name: Validate release-note LLM config
        shell: bash
        run: |
          : "${RELEASE_LLM_API_KEY:?Missing secret RELEASE_LLM_API_KEY}"
          : "${RELEASE_LLM_MODEL:?Missing secret RELEASE_LLM_MODEL}"
          : "${SECONDLOOP_UPDATE_SIGNING_PRIVATE_KEY:?Missing secret SECONDLOOP_UPDATE_SIGNING_PRIVATE_KEY}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app release tag: ${GITHUB_REF_NAME}. Expected vX.Y.Z"
            exit 1
          fi
      - name: Generate WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          installer_path="dist/SecondLoop-win.msi"
          metadata_path="dist/SecondLoop-win.metadata.json"
          if [[ ! -f "${installer_path}" ]]; then
            echo "Windows installer asset not found under dist/: ${installer_path}"
            exit 1
          fi
          if [[ ! -f "${metadata_path}" ]]; then
            echo "Windows installer metadata asset not found under dist/: ${metadata_path}"
            exit 1
          fi
          echo "Using installer for WinGet manifest: ${installer_path}"
          echo "Using installer metadata for WinGet manifest: ${metadata_path}"
          python3 scripts/generate_winget_manifests.py --release-tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --installer-path "${installer_path}" --installer-metadata-path "${metadata_path}" --output-dir dist/winget-manifests --package-identifier SecondLoop.SecondLoop --package-name SecondLoop --publisher SecondLoop
          (
            cd dist
            zip -r "SecondLoop-winget-manifests-${GITHUB_REF_NAME}.zip" winget-manifests >/dev/null
          )
      - name: Generate signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/generate_update_manifest.dart \
            --input-dir dist \
            --output-dir dist \
            --version "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --base-download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --signing-private-key "${SECONDLOOP_UPDATE_SIGNING_PRIVATE_KEY}"
      - name: Collect release facts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_ai.py collect-facts \
            --repo "${GITHUB_REPOSITORY}" \
            --base-tag auto \
            --auto-base-source github-releases \
            --head-tag "${GITHUB_REF_NAME}" \
            --output dist/release_facts.json
      - name: Generate and validate release notes assets
        shell: bash
        run: |
          set -euo pipefail
          notes_dir='dist/release-notes'
          python3 scripts/release_ai.py generate-notes \
            --facts dist/release_facts.json \
            --tag "${GITHUB_REF_NAME}" \
            --locales "${RELEASE_NOTES_LOCALES}" \
            --output-dir "${notes_dir}"
          python3 scripts/release_ai.py validate-notes \
            --facts dist/release_facts.json \
            --tag "${GITHUB_REF_NAME}" \
            --locales "${RELEASE_NOTES_LOCALES}" \
            --notes-dir "${notes_dir}"
          python3 scripts/release_ai.py render-markdown \
            --tag "${GITHUB_REF_NAME}" \
            --locales "${RELEASE_NOTES_LOCALES}" \
            --notes-dir "${notes_dir}" \
            --facts dist/release_facts.json \
            --output dist/release-notes.md
      - name: Append install guidance and build provenance
        shell: bash
        run: |
          set -euo pipefail
          generated_at_utc="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo
            echo "---"
            echo
            echo "## Build Provenance"
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            echo "- Workflow run: [#${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            printf -- '- Workflow attempt: `%s`\n' "${GITHUB_RUN_ATTEMPT}"
            printf -- '- Generated at (UTC): `%s`\n' "${generated_at_utc}"
            echo
            cat scripts/release_notes_install_guidance.md
          } >> dist/release-notes.md
      - name: Publish GitHub Release
        id: publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sha256
            dist/SecondLoop-win.msi
            dist/SecondLoop-win.msi.sha256
            dist/SecondLoop-win.metadata.json
            dist/*Setup*.exe
            dist/*.nupkg
            dist/releases.*.json
            dist/assets.*.json
            dist/*.tar.gz
            dist/latest.json
            dist/latest.json.sig
            dist/SecondLoop-winget-manifests-*.zip
            dist/release-notes/*.json
            dist/release-notes.md
      - name: Summarize GitHub Release publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Release pipeline status"
            echo
            echo "- GitHub Release published: ${{ steps.publish_github_release.outcome }}"
            echo "- WinGet manifest validation: pending"
            echo "- WinGet upstream PR publication: pending"
          } >> "${GITHUB_STEP_SUMMARY}"
  validate_winget_manifest:
    runs-on: windows-latest
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate WinGet manifests for validation
        shell: pwsh
        run: |
          $distDir = (Resolve-Path 'dist').Path
          $installerPath = Join-Path $distDir 'SecondLoop-win.msi'
          $metadataPath = Join-Path $distDir 'SecondLoop-win.metadata.json'
          if (-not (Test-Path $installerPath)) {
            throw "Windows installer asset not found: $installerPath"
          }
          if (-not (Test-Path $metadataPath)) {
            throw "Windows installer metadata asset not found: $metadataPath"
          }
          python scripts/generate_winget_manifests.py --release-tag "$Env:GITHUB_REF_NAME" --repo "$Env:GITHUB_REPOSITORY" --installer-path "$installerPath" --installer-metadata-path "$metadataPath" --output-dir dist/winget-manifests --package-identifier SecondLoop.SecondLoop --package-name SecondLoop --publisher SecondLoop
      - name: Validate WinGet manifest
        id: validate_winget
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/validate_winget_manifest.ps1 -ManifestDir dist/winget-manifests
      - name: Summarize WinGet validation
        if: always()
        shell: pwsh
        run: |
          @"
          ## Release pipeline status

          - GitHub Release published: handled in publish job
          - WinGet manifest validation: ${{ steps.validate_winget.outcome }}
          - WinGet upstream PR publication: pending
          "@ | Out-File -FilePath $Env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish_homebrew_cask:
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: dale0525/SecondLoopHomebrew
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate homebrew tap config
        shell: bash
        run: |
          : "${HOMEBREW_TAP_TOKEN:?Missing secret HOMEBREW_TAP_TOKEN}"
      - name: Publish Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish_homebrew_cask.sh \
            --tap-repo "${HOMEBREW_TAP_REPO}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --token "${HOMEBREW_TAP_TOKEN}"

  publish_winget_manifest:
    runs-on: ubuntu-latest
    needs: [publish, validate_winget_manifest]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
      WINGET_PKGS_UPSTREAM_REPO: microsoft/winget-pkgs
      WINGET_PKGS_FORK_REPO: ${{ vars.WINGET_PKGS_FORK_REPO || format('{0}/winget-pkgs', github.repository_owner) }}
      WINGET_AUTO_AGREE_CLA: ${{ vars.WINGET_AUTO_AGREE_CLA || 'true' }}
      WINGET_CLA_COMPANY: ${{ vars.WINGET_CLA_COMPANY || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate winget config
        shell: bash
        run: |
          : "${WINGET_PKGS_TOKEN:?Missing secret WINGET_PKGS_TOKEN}"
          : "${WINGET_PKGS_FORK_REPO:?Missing WINGET_PKGS_FORK_REPO}"
      - name: Publish WinGet manifest PR
        id: publish_winget_pr
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish_winget_manifest.sh \
            --release-tag "${GITHUB_REF_NAME}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --upstream-repo "${WINGET_PKGS_UPSTREAM_REPO}" \
            --fork-repo "${WINGET_PKGS_FORK_REPO}" \
            --token "${WINGET_PKGS_TOKEN}" \
            --auto-agree-cla="${WINGET_AUTO_AGREE_CLA}" \
            --cla-company "${WINGET_CLA_COMPANY}" \
            --package-id "SecondLoop.SecondLoop"
      - name: Summarize WinGet publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Release pipeline status"
            echo
            echo "- GitHub Release published: completed in publish job"
            echo "- WinGet manifest validation: completed in validate_winget_manifest job"
            echo "- WinGet upstream PR publication: ${{ steps.publish_winget_pr.outcome }}"
          } >> "${GITHUB_STEP_SUMMARY}"
