name: SecondLoop quality

on:
  pull_request:
    paths:
      - ".github/workflows/secondloop-quality.yml"
      - ".github/workflows/macos-desktop-package.yml"
      - "products/secondloop/**"
      - "apps/desktop/**"
      - "catalog/**"
      - "skills/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pixi.lock"
      - "pixi.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondloop-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: secondloop-quality
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
      - name: Install Desktop dependencies
        run: pixi run npm --prefix apps/desktop ci
      - name: Validate Agent App contracts
        run: |
          pixi run validate-agent-assets
          pixi run validate-secondloop
      - name: Check generated scripts and source budgets
        run: |
          pixi run test-dev-script
          pixi run source-lines
      - name: Check Rust formatting
        run: pixi run cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: pixi run cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: pixi run cargo test --workspace
      - name: Test Desktop
        run: pixi run npm --prefix apps/desktop test
      - name: Check Desktop types
        run: >-
          pixi run npm --prefix apps/desktop exec tsc --
          --noEmit -p apps/desktop/tsconfig.vitest.json
