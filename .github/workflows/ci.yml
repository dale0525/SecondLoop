name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tooling_python: ${{ steps.filter.outputs.tooling_python }}
      flutter: ${{ steps.filter.outputs.flutter }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tooling_python:
              - ".githooks/**"
              - ".github/workflows/**"
              - "pixi.toml"
              - "pixi.lock"
              - "scripts/**"
              - "tools/**/*.py"
              - "tools/check_icon_corners.py"
              - "tools/i18n_translate.py"
              - "tools/round_icon.py"
              - "tools/week11_gateway_smoke.py"
              - "tools/windows_https_update_server.py"
            flutter:
              - ".fvm/fvm_config.json"
              - ".githooks/**"
              - ".github/workflows/**"
              - "analysis_options.yaml"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "pixi.lock"
              - "slang.yaml"
              - "lib/**"
              - "test/**"
              - "integration_test/**"
              - "test_driver/**"
              - "third_party/**"
              - "assets/**"
              - "android/**"
              - "ios/**"
              - "linux/**"
              - "macos/**"
              - "windows/**"
              - "pixi.toml"
              - "scripts/**"
              - "tools/**/*.py"
              - "tools/*.dart"
              - "!scripts/tests/**"
              - "!tools/check_icon_corners.py"
              - "!tools/i18n_translate.py"
              - "!tools/round_icon.py"
              - "!tools/week11_gateway_smoke.py"
              - "!tools/windows_https_update_server.py"
            web:
              - ".fvm/fvm_config.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/web-build.yml"
              - "analysis_options.yaml"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "pixi.lock"
              - "slang.yaml"
              - "lib/**"
              - "test/**"
              - "integration_test/**"
              - "test_driver/**"
              - "third_party/**"
              - "assets/**"
              - "android/**"
              - "ios/**"
              - "linux/**"
              - "macos/**"
              - "windows/**"
              - "web/**"
  python-tooling:
    needs: changes
    if: needs.changes.outputs.tooling_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - name: Python tooling checks
        run: pixi run tooling-test

  flutter-gate:
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Flutter gate
        run: bash .githooks/pre-commit --check --flutter

  flutter-tests:
    needs: [changes, flutter-gate]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.shard_index == 0
        run: |
          sudo apt-get update
          indicator_pkg='libayatana-appindicator3-dev'
          if ! apt-cache show "${indicator_pkg}" >/dev/null 2>&1; then
            indicator_pkg='libappindicator3-dev'
          fi
          sudo apt-get install -y \
            libgtk-3-dev \
            "${indicator_pkg}" \
            libkeybinder-3.0-dev \
            libsecret-1-dev \
            pkg-config \
            xvfb
      - name: Pub get
        run: flutter pub get
      - name: Generate i18n
        run: dart run slang
      - name: Flutter test shard
        run: bash scripts/run_flutter_test_shard.sh --shard-index "${{ matrix.shard_index }}" --shard-count 4

  flutter-web:
    needs: [changes, flutter-gate]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Generate i18n
        run: dart run slang
      - name: Web smoke tests
        run: flutter test test/web_app/web_app_gate_test.dart test/web_app/web_app_service_http_test.dart
      - name: Build web
        run: flutter build web --base-href /app/
